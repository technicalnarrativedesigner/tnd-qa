[project]
name = "tnd-qa"
version = "0.1.0"
description = "Playwright + pytest portfolio tests for SauceDemo (Swag Labs)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "pytest>=7.4.0",
    "pytest-playwright>=0.4.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = []

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pages*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: fast critical-path tests",
    "regression: broader functional coverage",
]
