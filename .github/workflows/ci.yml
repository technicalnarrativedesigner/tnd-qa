name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  playwright:
    name: UI (Playwright, ${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: ui
    env:
      BASE_URL: https://www.saucedemo.com
      STANDARD_USER: ${{ secrets.STANDARD_USER }}
      STANDARD_PASSWORD: ${{ secrets.STANDARD_PASSWORD }}
      LOCKED_OUT_USER: ${{ secrets.LOCKED_OUT_USER }}
      LOCKED_OUT_PASSWORD: ${{ secrets.LOCKED_OUT_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Playwright browser
        run: |
          python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright suite
        run: pytest --browser ${{ matrix.browser }}

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ matrix.browser }}
          path: |
            ui/test-results
            ui/playwright-report
          if-no-files-found: ignore

  selenium:
    name: UI (Selenium, ${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    defaults:
      run:
        working-directory: selenium
    env:
      BASE_URL: https://www.saucedemo.com
      STANDARD_USER: ${{ secrets.STANDARD_USER }}
      STANDARD_PASSWORD: ${{ secrets.STANDARD_PASSWORD }}
      LOCKED_OUT_USER: ${{ secrets.LOCKED_OUT_USER }}
      LOCKED_OUT_PASSWORD: ${{ secrets.LOCKED_OUT_PASSWORD }}
      SELENIUM_BROWSER: ${{ matrix.browser }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Firefox
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Selenium suite
        run: pytest

  java_playwright:
    name: UI (Java Playwright, ${{ matrix.browser }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: java/playwright
    env:
      BASE_URL: https://www.saucedemo.com
      STANDARD_USER: ${{ secrets.STANDARD_USER }}
      STANDARD_PASSWORD: ${{ secrets.STANDARD_PASSWORD }}
      LOCKED_OUT_USER: ${{ secrets.LOCKED_OUT_USER }}
      LOCKED_OUT_PASSWORD: ${{ secrets.LOCKED_OUT_PASSWORD }}
      HEADED: false
      BROWSER: ${{ matrix.browser }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install Playwright browser dependencies
        run: mvn -q exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install-deps ${{ matrix.browser }}"

      - name: Install Playwright browser binaries
        run: mvn -q exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install ${{ matrix.browser }}"

      - name: Run Java Playwright suite
        run: mvn test

      - name: Upload Java Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-playwright-surefire-${{ matrix.browser }}
          path: java/playwright/target/surefire-reports
          if-no-files-found: ignore

  java_selenium:
    name: UI (Java Selenium, ${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    defaults:
      run:
        working-directory: java/selenium
    env:
      BASE_URL: https://www.saucedemo.com
      STANDARD_USER: ${{ secrets.STANDARD_USER }}
      STANDARD_PASSWORD: ${{ secrets.STANDARD_PASSWORD }}
      LOCKED_OUT_USER: ${{ secrets.LOCKED_OUT_USER }}
      LOCKED_OUT_PASSWORD: ${{ secrets.LOCKED_OUT_PASSWORD }}
      HEADED: false
      SELENIUM_BROWSER: ${{ matrix.browser }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Firefox
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@v1

      - name: Run Java Selenium suite
        run: mvn test

      - name: Upload Java Selenium reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-selenium-surefire-${{ matrix.browser }}
          path: java/selenium/target/surefire-reports
          if-no-files-found: ignore

  api_postman:
    name: API (Postman/Newman)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/postman
    env:
      REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure API key is configured
        run: |
          if [ -z "$REQRES_API_KEY" ]; then
            echo "REQRES_API_KEY is missing in GitHub repository secrets." >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies
        run: npm install

      - name: Run Newman suite
        run: |
          mkdir -p reports
          npx newman run reqres.collection.json \
            -e reqres.environment.example.json \
            --env-var "apiKey=$REQRES_API_KEY" \
            --env-var "reqresEnv=prod" \
            --reporters cli,junit,json \
            --reporter-junit-export reports/newman-junit.xml \
            --reporter-json-export reports/newman-report.json

      - name: Upload Newman artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-artifacts
          path: api/postman/reports
          if-no-files-found: ignore
