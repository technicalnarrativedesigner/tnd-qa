name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  playwright:
    name: UI (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    env:
      BASE_URL: https://www.saucedemo.com
      STANDARD_USER: ${{ secrets.STANDARD_USER }}
      STANDARD_PASSWORD: ${{ secrets.STANDARD_PASSWORD }}
      LOCKED_OUT_USER: ${{ secrets.LOCKED_OUT_USER }}
      LOCKED_OUT_PASSWORD: ${{ secrets.LOCKED_OUT_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Playwright suite
        run: pytest

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            ui/test-results
            ui/playwright-report
          if-no-files-found: ignore

  selenium:
    name: UI (Selenium)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: selenium
    env:
      BASE_URL: https://www.saucedemo.com
      STANDARD_USER: ${{ secrets.STANDARD_USER }}
      STANDARD_PASSWORD: ${{ secrets.STANDARD_PASSWORD }}
      LOCKED_OUT_USER: ${{ secrets.LOCKED_OUT_USER }}
      LOCKED_OUT_PASSWORD: ${{ secrets.LOCKED_OUT_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Selenium suite
        run: pytest

  api_postman:
    name: API (Postman/Newman)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/postman
    env:
      REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure API key is configured
        run: |
          if [ -z "$REQRES_API_KEY" ]; then
            echo "REQRES_API_KEY is missing in GitHub repository secrets." >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies
        run: npm install

      - name: Run Newman suite
        run: |
          mkdir -p reports
          npx newman run reqres.collection.json \
            -e reqres.environment.example.json \
            --env-var "apiKey=$REQRES_API_KEY" \
            --env-var "reqresEnv=prod" \
            --reporters cli,junit,json \
            --reporter-junit-export reports/newman-junit.xml \
            --reporter-json-export reports/newman-report.json

      - name: Upload Newman artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-artifacts
          path: api/postman/reports
          if-no-files-found: ignore
